version: "3"

vars:
  # Health gate shared by upgrade-talos and reboot. Waits for the node to rejoin
  # Ready, then for every attached Longhorn volume to return to healthy. Rebuild
  # I/O from the node that just came back is what collapses iSCSI sessions on the
  # other nodes and cascades them NotReady, so no rolling operation may touch
  # node N+1 until node N's replicas have finished rebuilding (see
  # docs/plans/2026-04-27-cilium-iscsi-cascade-postmortem.md). Only enforced when
  # the caller also sets ABORT_ON_FAIL.
  NODE_HEALTH_GATE: |
    echo "Waiting for $NODE to become Ready..."
    kubectl wait --for=condition=Ready "node/$NODE" --timeout=600s
    echo "Waiting for Longhorn volumes to settle..."
    for i in $(seq 1 90); do
      UNHEALTHY=$(kubectl get volumes.longhorn.io -n longhorn-system -o json \
        | jq -r '.items[] | select(.status.state=="attached" and .status.robustness!="healthy") | .metadata.name')
      if [ -z "$UNHEALTHY" ]; then
        echo "All attached volumes healthy"
        exit 0
      fi
      echo "  waiting on: $(echo $UNHEALTHY | tr '\n' ' ')"
      sleep 10
    done
    echo "ERROR: volumes still unhealthy after 15m"
    exit 1

tasks:

  _run-on-nodes:
    internal: true
    # Reusable node loop: iterates nodes, runs a command, tracks failures.
    # CMD_TEMPLATE / POST_NODE_CMD are passed via environment and executed with
    # `sh -c` so they use normal shell quoting ($NODE and $NODE_IP are exported).
    # Do NOT inline them with eval — quotes inside an eval'd template get
    # consumed by the outer parse and silently break comparisons and jq filters.
    # Required vars:
    #   ACTION_VERB  - present participle for logging (e.g., "Upgrading Talos on")
    #   ACTION_PAST  - past tense for failure summary (e.g., "upgrade")
    #   CMD_TEMPLATE - shell command to run per node
    #   TARGET_NODES - space-separated node names (defaults to all nodes)
    #   POST_NODE_CMD - optional health gate run after each node succeeds
    #                   (defaults to `true`)
    #   ABORT_ON_FAIL - "true" stops at the first failed node instead of moving
    #                   on. Required for rolling upgrades: acting on node N+1
    #                   while node N is still unhealthy is what turns a single
    #                   sick node into a cluster-wide outage. Defaults to
    #                   "false" so `reset` still sweeps every node.
    env:
      NODE_CMD: "{{.CMD_TEMPLATE}}"
      POST_CMD: "{{.POST_NODE_CMD | default \"true\"}}"
      ABORT_ON_FAIL: "{{.ABORT_ON_FAIL | default \"false\"}}"
    cmds:
      - |
        if [ -n "{{.TARGET_NODES}}" ]; then
          NODES="{{.TARGET_NODES}}"
        else
          NODES="{{.NODE_NAMES}}"
        fi
        FAILED=""
        for NODE in $NODES; do
          NODE_IP=$(yq ".nodes[] | select(.name == \"$NODE\") | .ip" vars.yaml)
          export NODE NODE_IP
          echo "{{.ACTION_VERB}} $NODE ($NODE_IP)..."
          if sh -c "$NODE_CMD"; then
            echo "$NODE: OK"
            if ! sh -c "$POST_CMD"; then
              FAILED="$FAILED $NODE"
              if [ "$ABORT_ON_FAIL" = "true" ]; then
                echo "ERROR: post-{{.ACTION_PAST}} health check failed for $NODE, aborting before touching another node"
                break
              fi
              echo "WARNING: post-{{.ACTION_PAST}} health check failed for $NODE, continuing..."
            fi
          else
            FAILED="$FAILED $NODE"
            if [ "$ABORT_ON_FAIL" = "true" ]; then
              echo "ERROR: failed to {{.ACTION_PAST}} $NODE, aborting before touching another node"
              break
            fi
            echo "WARNING: Failed to {{.ACTION_PAST}} $NODE, continuing..."
          fi
        done
        if [ -n "$FAILED" ]; then
          echo ""
          echo "Failed to {{.ACTION_PAST}}:$FAILED"
          exit 1
        fi

  upgrade-talos:
    desc: "Upgrade Talos OS on all nodes or a specific node (usage: task day2:upgrade-talos [-- <node-name>])"
    deps: [":_require-nodes"]
    vars:
      SCHEMATIC_ID:
        sh: curl -sX POST --data-binary @factory.yaml https://factory.talos.dev/schematics | jq -r '.id'
    cmds:
      # Pre-flight: refuse to start while any Longhorn volume is degraded or
      # faulted. Rebuild I/O during a drain is what collapses iSCSI sessions on
      # the other nodes and cascades them NotReady (see
      # docs/plans/2026-04-27-cilium-iscsi-cascade-postmortem.md and
      # docs/plans/2026-07-10-cnpg-local-storage-design.md). Skips silently if
      # the cluster is unreachable (fresh bootstrap has no Longhorn yet).
      - |
        DEGRADED=$(kubectl get volumes.longhorn.io -n longhorn-system -o json 2>/dev/null \
          | jq -r '[.items[] | select(.status.robustness=="degraded" or .status.robustness=="faulted")] | length' 2>/dev/null)
        if [ -n "$DEGRADED" ] && [ "$DEGRADED" != "0" ]; then
          echo "ERROR: $DEGRADED Longhorn volume(s) degraded/faulted — wait for rebuilds to finish before upgrading:"
          kubectl get volumes.longhorn.io -n longhorn-system -o json \
            | jq -r '.items[] | select(.status.robustness=="degraded" or .status.robustness=="faulted") | "  " + .metadata.name'
          exit 1
        fi
      - task: _run-on-nodes
        vars:
          TARGET_NODES: "{{.CLI_ARGS}}"
          ACTION_VERB: "Upgrading Talos on"
          ACTION_PAST: "upgrade"
          ABORT_ON_FAIL: "true"
          # Runs via `sh -c` with $NODE / $NODE_IP exported (see _run-on-nodes).
          # Forfeiting leadership before upgrading the leader sidesteps Talos's
          # in-pre-flight transfer, which can hang when the leader is older
          # than the target version.
          CMD_TEMPLATE: |
            IDS=$(talosctl --context {{.CLUSTER_NAME}} -n "$NODE_IP" etcd status 2>/dev/null | tail -n +2 | grep -oE '[0-9a-f]{16}' || true)
            MEMBER_ID=$(echo "$IDS" | sed -n '1p')
            LEADER_ID=$(echo "$IDS" | sed -n '2p')
            if [ -n "$MEMBER_ID" ] && [ "$MEMBER_ID" = "$LEADER_ID" ]; then
              echo "$NODE is etcd leader, forfeiting before upgrade"
              talosctl --context {{.CLUSTER_NAME}} -n "$NODE_IP" etcd forfeit-leadership
              sleep 5
            fi
            talosctl upgrade \
              --context {{.CLUSTER_NAME}} \
              --nodes "$NODE_IP" \
              --image "factory.talos.dev/installer-secureboot/{{.SCHEMATIC_ID}}:{{.TALOS_VERSION}}"
          POST_NODE_CMD: "{{.NODE_HEALTH_GATE}}"

  upgrade-k8s:
    desc: Upgrade Kubernetes version (cluster-wide)
    deps: [":_require-nodes"]
    cmds:
      - talosctl upgrade-k8s
          --context {{.CLUSTER_NAME}}
          --to {{.KUBERNETES_VERSION}}

  join-node:
    desc: "Join a new node to the existing cluster (usage: task day2:join-node -- <node-name>)"
    deps: [":_require-nodes"]
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task day2:join-node -- <node-name>"
      - sh: yq -e '.nodes[] | select(.name == "{{.CLI_ARGS}}")' vars.yaml
        msg: "Node '{{.CLI_ARGS}}' not found in vars.yaml"
      - sh: '[ -f generated/secrets.yaml ]'
        msg: "generated/secrets.yaml not found. Run 'task setup' first on the initial node."
    vars:
      JOIN_NODE: "{{.CLI_ARGS}}"
      JOIN_NODE_IP:
        sh: yq '.nodes[] | select(.name == "{{.CLI_ARGS}}") | .ip' vars.yaml
    cmds:
      - echo "Generating config for {{.JOIN_NODE}} using existing cluster secrets..."
      - talosctl gen config
          --with-secrets generated/secrets.yaml
          --output generated/
          --force
          {{.CLUSTER_NAME}}
          https://{{.CONTROL_PLANE_ENDPOINT}}:{{.CONTROL_PLANE_PORT}}
      - task: :setup:_generate-shared-patches
      - task: :setup:_patch-node
        vars:
          NODE_NAME: "{{.JOIN_NODE}}"
      - task: :setup:_apply-node
        vars:
          NODE_NAME: "{{.JOIN_NODE}}"
      - 'echo "{{.JOIN_NODE}} will now install Talos and join the cluster."'
      - 'echo "Monitor progress with: talosctl --context {{.CLUSTER_NAME}} --nodes {{.JOIN_NODE_IP}} dmesg -f"'

  reboot:
    desc: "Reboot all nodes or a specific node (usage: task day2:reboot [-- <node-name>])"
    deps: [":_require-nodes"]
    cmds:
      - task: _run-on-nodes
        vars:
          TARGET_NODES: "{{.CLI_ARGS}}"
          ACTION_VERB: "Rebooting"
          ACTION_PAST: "reboot"
          ABORT_ON_FAIL: "true"
          CMD_TEMPLATE: >-
            talosctl reboot --context {{.CLUSTER_NAME}} --nodes "$NODE_IP"
          # A rolling reboot drains nodes exactly like a rolling upgrade, so it
          # carries the same hazard and needs the same gate.
          POST_NODE_CMD: "{{.NODE_HEALTH_GATE}}"

  reset:
    desc: "Wipe all nodes or a specific node (DESTRUCTIVE, usage: task day2:reset [-- <node-name>])"
    prompt: This will WIPE node(s) and destroy all data. Are you sure?
    deps: [":_require-nodes"]
    cmds:
      - task: _run-on-nodes
        vars:
          TARGET_NODES: "{{.CLI_ARGS}}"
          ACTION_VERB: "Resetting"
          ACTION_PAST: "reset"
          CMD_TEMPLATE: >-
            talosctl reset --context {{.CLUSTER_NAME}} --nodes "$NODE_IP" --graceful=false --reboot
