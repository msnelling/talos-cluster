version: "3"

tasks:

  status:
    desc: Show cluster health and node status
    deps: [":_require-nodes"]
    preconditions:
      - sh: command -v cilium
        msg: "cilium CLI is required. Install with: brew install cilium-cli"
    cmds:
      - talosctl health --context {{.CLUSTER_NAME}}
      - kubectl --context admin@{{.CLUSTER_NAME}} get nodes -o wide
      - cilium status --context admin@{{.CLUSTER_NAME}}

  dashboard:
    desc: "Open Talos dashboard (usage: task utility:dashboard [-- <node-name> ...])"
    deps: [":_require-nodes"]
    interactive: true
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          IPS=""
          for NODE in {{.CLI_ARGS}}; do
            IP=$(yq ".nodes[] | select(.name == \"$NODE\") | .ip" vars.yaml)
            if [ -n "$IPS" ]; then IPS="$IPS,$IP"; else IPS="$IP"; fi
          done
        else
          IPS="{{.ALL_CP_IPS | replace " " ","}}"
        fi
        exec talosctl dashboard --context {{.CLUSTER_NAME}} --nodes "$IPS"

  disks:
    desc: List disks on all nodes (useful before first install)
    deps: [":_require-nodes"]
    cmds:
      - for: { var: NODE_NAMES, as: NODE }
        task: _talosctl-per-node
        vars:
          NODE_NAME: "{{ .NODE }}"
          TALOSCTL_CMD: "get disks"

  links:
    desc: List network interfaces on all nodes
    deps: [":_require-nodes"]
    cmds:
      - for: { var: NODE_NAMES, as: NODE }
        task: _talosctl-per-node
        vars:
          NODE_NAME: "{{ .NODE }}"
          TALOSCTL_CMD: "get links"

  _talosctl-per-node:
    internal: true
    vars:
      NODE_IP:
        sh: yq '.nodes[] | select(.name == "{{.NODE_NAME}}") | .ip' vars.yaml
    cmds:
      - echo "=== {{.NODE_NAME}} ({{.NODE_IP}}) ==="
      - talosctl {{.TALOSCTL_CMD}} --insecure --nodes {{.NODE_IP}}

  plex-audio-tracks:
    desc: "Run the Plex audio track job now (usage: [MAX_CHANGES=N] [MAX_MOVES=N] task utility:plex-audio-tracks [-- --apply])"
    deps: [":_require-yq"]
    summary: |
      Creates a one-off Job from the plex-audio-tracks CronJob and prints its
      log. Without -- --apply the Job runs with APPLY=false, so it prints the
      selection plan, the files that need a DD+ Atmos replacement and the
      Radarr moves it would make, and changes nothing. The CronJob itself
      applies nightly.

      MAX_CHANGES=N / MAX_MOVES=N raise the selection and Radarr move caps for
      this run only — the way to get past a deliberately large plan (a Plex
      re-scan that reset selections, a bulk tagging session in Radarr) without
      touching values.yaml. Do not kubectl set env the CronJob: ArgoCD
      self-heal reverts it.
    cmds:
      - |
        NAME="plex-audio-tracks-manual-$(date +%s)"
        env_set() { yq "(.spec.template.spec.containers[0].env[] | select(.name == \"$1\")).value = \"$2\""; }
        kubectl create job -n db3000 --from=cronjob/plex-audio-tracks "${NAME}" --dry-run=client -o yaml \
          | if [ "{{.CLI_ARGS}}" = "--apply" ]; then cat; else env_set APPLY false; fi \
          | if [ -n "${MAX_CHANGES:-}" ]; then env_set MAX_CHANGES "${MAX_CHANGES}"; else cat; fi \
          | if [ -n "${MAX_MOVES:-}" ]; then env_set MAX_MOVES "${MAX_MOVES}"; else cat; fi \
          | kubectl apply -f - >/dev/null
        until kubectl get job -n db3000 "${NAME}" -o jsonpath='{.status.succeeded}{.status.failed}' | grep -q .; do
          sleep 3
        done
        kubectl logs -n db3000 "job/${NAME}" --all-containers
        SUCCEEDED=$(kubectl get job -n db3000 "${NAME}" -o jsonpath='{.status.succeeded}')
        kubectl delete job -n db3000 "${NAME}" --wait=false >/dev/null
        [ "${SUCCEEDED}" = "1" ]
