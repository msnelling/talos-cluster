apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-compat
  labels:
    {{- include "silo.labels" . | nindent 4 }}
  annotations:
    # Jellyfin and Audiobookshelf clients expect these listeners on the shared LAN address.
    lbipam.cilium.io/ips: "10.1.1.61"
    lbipam.cilium.io/sharing-key: db3000
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  ports:
    - name: jellyfin
      port: 8096
      targetPort: jellyfin
      protocol: TCP
    - name: audiobookshelf
      port: 13378
      targetPort: audiobookshelf
      protocol: TCP
  selector:
    {{- include "silo.selectorLabels" . | nindent 4 }}
