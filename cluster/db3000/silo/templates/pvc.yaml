apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.persistence.data.existingVolume }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.data.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: {{ .Values.persistence.data.existingVolume }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: longhorn
  volumeName: {{ .Values.persistence.data.existingVolume }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
