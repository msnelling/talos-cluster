image:
  repository: ghcr.io/silo-server/silo-server
  # Pre-release with no versioned tags, so track `latest` by digest; Renovate updates the digest.
  tag: "latest@sha256:4135ad1c1177228be9cdcf4aa44df3442148ba1d6eec6c96268679601a10ad63"
  pullPolicy: IfNotPresent

existingSecret: silo-secrets

# POSTGRES_TUNE=auto runs ALTER SYSTEM. This database is the shared CNPG
# cluster, so tuning stays off.
env:
  TZ: Europe/London
  MODE: integrated
  REDIS_URL: redis://127.0.0.1:6379
  SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
  POSTGRES_TUNE: "off"
  # The media share only admits this account (mount options on the
  # db3000-media-share PV). Silo re-owns its data volume to match at startup.
  PUID: "568"
  PGID: "1001"

redis:
  image:
    repository: redis
    tag: "8.10.3-alpine"
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi

persistence:
  data:
    size: 30Gi
    existingVolume: db3000-silo-data
  redis:
    size: 1Gi
    existingVolume: db3000-silo-redis
  media:
    claimName: media-share
    mountPath: /mnt/media

service:
  port: 80

httproute:
  hostname: silo.xmple.io

nodeSelector:
  gpu.intel.com/device-id.0300-3e92.present: "true"

resources:
  requests:
    memory: 4Gi
  limits:
    memory: 4Gi
    gpu.intel.com/i915: "1"

terminationGracePeriodSeconds: 120
