image:
  registry: docker.io
  repository: python
  tag: "3.14.7-alpine3.24"
  pullPolicy: IfNotPresent

# After the overnight import window, so new grabs are fixed before anyone
# watches them.
schedule: "0 5 * * *"
timeZone: Europe/London

plexUrl: http://plex.db3000.svc:32400
existingSecret: plex-token

# Refuse to apply a plan larger than this. A runaway plan is more likely to
# mean Plex changed shape than that the library did, and this runs unattended.
maxChanges: 50

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Phase 3: films the report lists are moved onto this profile and searched
# once, but only when tagged in Radarr — the tag is the decision to replace
# a disc remux with a WEB-DL. The API key comes from the Recyclarr secret.
radarr:
  url: http://radarr.db3000.svc/radarr
  existingSecret: recyclarr-api-keys
  profile: Apple TV Atmos (1080p/2160p)
  tag: atmos-upgrade
  search: true
  maxMoves: 10
