image:
  registry: ghcr.io
  repository: recyclarr/recyclarr
  tag: "8.7.2"
  pullPolicy: IfNotPresent

# Runs weekly. Scores only affect new grabs and manual searches, so a
# frequent sync buys nothing; this exists to pick up upstream regex fixes.
schedule: "30 4 * * 0"

existingSecret: recyclarr-api-keys

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Audio scores tuned for Apple TV + Sonos Arc Ultra. The Apple TV decodes
# E-AC-3 JOC and outputs Dolby MAT over eARC with height intact, but cannot
# decode TrueHD or DTS at all, so TRaSH's defaults (which rank TrueHD ATMOS
# 5000 above DD+ ATMOS 3000, and DTS-X at 4500) are inverted here.
#
#   DD+ ATMOS         5000   height survives to the Arc Ultra
#   ATMOS (undefined) 3000   codec unknown from the title, might be DD+
#   TrueHD ATMOS      2000   has height, but the Apple TV cannot decode it
#   DD+               1750   TRaSH default, no height
#   TrueHD             500   no height and undecodable
#   DTS-X              250   object audio, but no DTS support in this chain
#   DTS-HD MA          200   same
#
# Every score is >= 0 and the four profiles these are assigned to use
# cutoffFormatScore 0, so no existing file drops below cutoff and nothing is
# re-downloaded automatically. The streaming profile below is the exception,
# and exists precisely to drive upgrades for titles moved onto it.
config: |
  radarr:
    movies:
      base_url: http://radarr.db3000.svc/radarr
      api_key: !env_var RADARR_API_KEY
      delete_old_custom_formats: false

      quality_profiles:
        # Radarr compares quality tier before custom format score, so a WEB-DL
        # is rejected as a downgrade against a Bluray-2160p file no matter how
        # the audio scores. This guide profile puts Bluray-2160p, WEBDL-2160p
        # and WEBRip-2160p in one quality group, which makes the scores below
        # the deciding factor instead. Remux-2160p is excluded — remuxes carry
        # TrueHD by definition.
        #
        # Recyclarr never assigns movies to a profile — do that in Radarr, one
        # title at a time, when you want the streaming-compatible version.
        - trash_id: e91c9adaca0231493f4af0d571b907f9  # [SQP] SQP-1 WEB (2160p)
          name: Apple TV Atmos (1080p/2160p)
          # Pulling the profile in by trash_id also syncs every custom format it
          # scores — dozens of release-group tiers, HDR and streaming-service
          # formats, not just the seven audio ones below. Its thresholds are
          # therefore left at the guide's own minFormatScore 1000 and
          # cutoffFormatScore 10000, which are calibrated for that whole set.
          #
          # Scores here come from TRaSH's streaming score set rather than the
          # values further down: DD+ ATMOS 135, DD+ 125, and TrueHD, TrueHD
          # ATMOS, DTS X and DTS-HD MA all -10000, so no release carrying those
          # can clear the minimum. Assigning both score sources to one profile
          # makes Recyclarr report "conflicting scores ... (first value wins)"
          # and resolve them by declaration order, which is no way to pin a
          # score.
          score_set: sqp-1-web-2160p

      custom_formats:
        - trash_ids:
            - 1af239278386be2919e1bcee0bde047e # DD+ ATMOS
          assign_scores_to: &radarr_profiles
            - name: Ultra-HD
            - name: HD-1080p/UltraHD
            - name: HD-1080p
            - name: Any
          score: 5000
        - trash_ids:
            - 417804f7f2c4308c1f4c5d380d4c4475 # ATMOS (undefined)
          assign_scores_to: *radarr_profiles
          score: 3000
        - trash_ids:
            - 496f355514737f7d83bf7aa4d24f8169 # TrueHD ATMOS
          assign_scores_to: *radarr_profiles
          score: 2000
        - trash_ids:
            - 185f1dd7264c4562b9022d963ac37424 # DD+
          assign_scores_to: *radarr_profiles
          score: 1750
        - trash_ids:
            - 3cafb66171b47f226146a0770576870f # TrueHD
          assign_scores_to: *radarr_profiles
          score: 500
        - trash_ids:
            - 2f22d89048b01681dde8afe203bf2e95 # DTS X
          assign_scores_to: *radarr_profiles
          score: 250
        - trash_ids:
            - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
          assign_scores_to: *radarr_profiles
          score: 200

      # Video codec and dynamic range. HEVC is already universal at 2160p, so
      # the preference mostly guards against the rare 2160p x264 release and
      # picks HEVC among equal 1080p candidates. It is scored on the stock
      # profiles too, which is where nearly all remaining 1080p x264 files
      # live; those profiles keep cutoffFormatScore 0, so the preference
      # steers new grabs without putting existing files up for replacement.
        - trash_ids:
            - 9170d55c319f4fe40da8711ba9d8050d # x265
          assign_scores_to: &radarr_appletv
            - name: Apple TV Atmos (1080p/2160p)
          score: 200
        - trash_ids:
            - 9170d55c319f4fe40da8711ba9d8050d # x265
          assign_scores_to: *radarr_profiles
          score: 200
      # The guide rejects 1080p x265 at -10000 because those releases are
      # re-encodes of the x264 source: smaller, but a generation down. That
      # trade is wanted here, so the rejection is neutralised and the
      # preference above decides instead. 1080p x265 carrying HDR or DV was
      # never covered by the rejection and is unaffected.
        - trash_ids:
            - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
          assign_scores_to: *radarr_appletv
          score: 0
      # SDR only matches 2160p releases carrying no HDR, DV, PQ or HLG. A mild
      # penalty rather than a rejection: some 4K titles were never graded HDR,
      # and blocking them would leave nothing to grab.
        - trash_ids:
            - 9c38ebb7384dada637be8899efa68e6f # SDR
          assign_scores_to: *radarr_appletv
          score: -200

  sonarr:
    tv:
      base_url: http://sonarr.db3000.svc/sonarr
      api_key: !env_var SONARR_API_KEY
      delete_old_custom_formats: false
      custom_formats:
        - trash_ids:
            - 4232a509ce60c4e208d13825b7c06264 # DD+ ATMOS
          assign_scores_to: &sonarr_profiles
            - name: Ultra-HD
            - name: HD-1080p/UltraHD
            - name: HD - 720p/1080p
            - name: HD-1080p
            - name: Any
          score: 5000
        - trash_ids:
            - b6fbafa7942952a13e17e2b1152b539a # ATMOS (undefined)
          assign_scores_to: *sonarr_profiles
          score: 3000
        - trash_ids:
            - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
          assign_scores_to: *sonarr_profiles
          score: 2000
        - trash_ids:
            - 63487786a8b01b7f20dd2bc90dd4a477 # DD+
          assign_scores_to: *sonarr_profiles
          score: 1750
        - trash_ids:
            - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
          assign_scores_to: *sonarr_profiles
          score: 500
        - trash_ids:
            - 9d00418ba386a083fbf4d58235fc37ef # DTS X
          assign_scores_to: *sonarr_profiles
          score: 250
        - trash_ids:
            - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
          assign_scores_to: *sonarr_profiles
          score: 200

      # Apple TV profile. Same preference order as above, but the codecs the
      # chain cannot decode are rejected outright rather than ranked low,
      # mirroring Radarr's SQP-1 WEB score set. WEB releases never carry
      # them anyway; this is the guard for the odd mislabelled one.
        - trash_ids:
            - 4232a509ce60c4e208d13825b7c06264 # DD+ ATMOS
          assign_scores_to: &appletv_profiles
            - name: Apple TV Atmos (2160p)
            - name: Apple TV Atmos (1080p/2160p)
          score: 5000
        - trash_ids:
            - b6fbafa7942952a13e17e2b1152b539a # ATMOS (undefined)
          assign_scores_to: *appletv_profiles
          score: 3000
        - trash_ids:
            - 63487786a8b01b7f20dd2bc90dd4a477 # DD+
          assign_scores_to: *appletv_profiles
          score: 1750
        - trash_ids:
            - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
            - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
            - 9d00418ba386a083fbf4d58235fc37ef # DTS X
            - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
            - cfa5fbd8f02a86fc55d8d223d06a5e1f # DTS-HD HRA
            - c1a25cd67b5d2e08287c957b1eb903ec # DTS-ES
            - 5964f2a8b3be407d083498e4459d05d0 # DTS
            - 851bd64e04c9374c51102be3dd9ae4cc # FLAC
            - 30f70576671ca933adbdcfc736a69718 # PCM
          assign_scores_to: *appletv_profiles
          score: -10000

      # Video codec and dynamic range, matching Radarr. Scores stay well below
      # the audio ones so codec never outranks Atmos.
        - trash_ids:
            - c9eafd50846d299b862ca9bb6ea91950 # x265
          assign_scores_to: *appletv_profiles
          score: 200
        - trash_ids:
            - c9eafd50846d299b862ca9bb6ea91950 # x265
          assign_scores_to: *sonarr_profiles
          score: 200
        - trash_ids:
            - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
          assign_scores_to: *appletv_profiles
          score: 0
        - trash_ids:
            - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
          assign_scores_to: *appletv_profiles
          score: -200

      # TRaSH "WEB-2160p (Combined)": WEB 1080p below WEB 2160p, cutoff at
      # 2160p, WEB only. Pulling it by trash_id also syncs the guide's
      # default format groups (WEB tiers, repacks, streaming boosts,
      # unwanted formats) for this profile. Series are opted in by hand:
      # a profile applies to every file of a series, so it is a per-show
      # decision (see the plex-audio-tracks report).
      # Two variants, because allowing 1080p changes when Sonarr grabs.
      # Sonarr never waits for a better release: it takes the best one
      # available the moment an episode airs. With 1080p allowed that is
      # almost always a 1080p WEB-DL, which is then downloaded a second time
      # when the 2160p release appears. Shows that reliably get a 4K release
      # belong on the 2160p-only variant so Sonarr waits; the combined one is
      # for shows where 1080p is the best that will ever exist.
      #
      # min_format_score 1 rejects releases that match no custom format at
      # all. The guide default of 0 let scoreless junk qualify, including two
      # fake torrents whose payload Sonarr refused to import.
      quality_profiles:
        - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
          name: Apple TV Atmos (2160p)
          min_format_score: 1
          reset_unmatched_scores:
            enabled: true
        - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
          name: Apple TV Atmos (1080p/2160p)
          min_format_score: 1
          reset_unmatched_scores:
            enabled: true
