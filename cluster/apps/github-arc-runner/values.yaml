gha-runner-scale-set:
  githubConfigUrl: "https://github.com/sociaei"
  githubConfigSecret: github-arc-app

  # socia-app's `runs-on` matches this name directly — ARC does not support the
  # `self-hosted` label, so the scale set name IS the tier label. Renamed from
  # github-arc-runner so the two read the same; see socia-app's
  # docs/plans/2026-08-02-self-hosted-ci-runners-design.md.
  runnerScaleSetName: "socia-std"

  minRunners: 0
  # Six concurrent trivial jobs. The std tier is socia-app's ~12 short CI jobs
  # plus its non-CI agent workflows — seconds to ~2 min each, and API-bound
  # rather than CPU-bound. At the sizing below they reserve 3 CPU / 6Gi between
  # them, which both NVMe nodes can carry; at full burst they would want
  # 12 CPU / 24Gi, the same deliberate oversubscription of idle-measuring
  # capacity as before.
  maxRunners: 6

  # Default mode — deliberately NOT containerMode: kubernetes.
  #
  # Kubernetes mode requires every job to declare `container:`, and no job in
  # socia-app does, so it would fail on all of them. It is also unnecessary:
  # every `uses:` in that repo is a node24 or composite action, so nothing needs
  # a Docker daemon.
  #
  # It is additionally ruled out by the revert guarantee the whole design rests
  # on. `container:` is not expressed through `runs-on`, so it would keep
  # applying after the tier variables were flipped back to GitHub-hosted —
  # turning a single-variable revert into a code change.

  template:
    spec:
      # Confine runners to the NVMe nodes (lenovo2/lenovo3), which also carry
      # twice the RAM of lenovo1. The label is set from machine.nodeLabels in
      # taskfiles/setup.yaml and derived from the install disk, so it survives a
      # node rebuild — same selector smartctl-exporter uses.
      #
      # In default mode this is the only pod involved: the job runs here rather
      # than in a hook-created second pod, so the selector now confines the work
      # directly instead of transitively via the work PVC's nodeAffinity.
      nodeSelector:
        xmple.io/disk-type: nvme
      # The image above is a private GHCR package. GHCR accepts only classic
      # PATs, so this secret holds one scoped to read:packages -- created out of
      # band by `task components:github-runner-pull-secret`, matching how
      # github-arc-app is created rather than living in git.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1001
      containers:
        # image and command restate the subchart's defaults verbatim. Helm
        # replaces lists rather than merging them, so overriding this list to
        # add resources drops every key it does not respell — and the chart
        # supplies no fallback for these two. Re-check them on chart upgrade.
        - name: runner
          # Stock actions-runner plus build-essential. socia-app's `bun install`
          # compiles better-sqlite3 via node-gyp, and the stock image ships
          # python3 but no compiler -- every std job that installs dependencies
          # (Type Check, Integration Tests, both UI builds) fails with
          # `gyp ERR! not found: make` without this. Built from
          # sociaei/socia-ci-runners runner-arc/Dockerfile, which changes
          # nothing else: same runner user, same /home/runner/run.sh contract.
          image: ghcr.io/sociaei/socia-ci-runner-arc:latest
          command: ["/home/runner/run.sh"]
          env:
            # Explicit rather than implied. Default mode does not require a job
            # container anyway, but stating it means a reader does not have to
            # infer the mode from the absence of a key.
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: "false"
          # Sized for the job now, not just the agent. Under kubernetes mode the
          # work happened in a separate hook-created pod and this pod only
          # polled, streamed logs and drove the hook — so the old 1 CPU / 2Gi
          # cap was right then and would throttle every job on the tier now.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
      volumes:
        # Declared explicitly because the chart declares no work volume outside
        # container mode — _work would otherwise land on the node's overlay
        # filesystem with nothing bounding it. sizeLimit makes a runaway job
        # evict its own pod rather than fill the node and take Longhorn, CNPG
        # and the media stack down with it.
        - name: work
          emptyDir:
            sizeLimit: 10Gi

  controllerServiceAccount:
    namespace: github-arc-controller
    name: github-arc-controller-gha-rs-controller
