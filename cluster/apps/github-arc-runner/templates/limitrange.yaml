apiVersion: v1
kind: LimitRange
metadata:
  name: runner-job-defaults
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    # Sizes the workflow job pods. Under containerMode kubernetes those pods are
    # created at runtime by the container hook, not by this chart, so they
    # inherit nothing from template.spec — a LimitRange is what reaches them.
    #
    # Burstable on purpose: the request is the floor the scheduler reserves, the
    # limit is GitHub's large-runner spec (4 cores / 16GB) the job may climb to.
    # Reserving the full 4 CPU would leave the job unschedulable, because the
    # nodes' requests are already committed well above their measured use.
    #
    # Applies per container, so a job declaring service containers draws these
    # defaults for each of them.
    - type: Container
      defaultRequest:
        cpu: "1"
        memory: 4Gi
      default:
        cpu: "4"
        memory: 16Gi
