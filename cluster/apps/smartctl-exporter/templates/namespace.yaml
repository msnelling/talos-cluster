apiVersion: v1
kind: Namespace
metadata:
  name: smartctl-exporter
  labels:
    # smartctl needs raw SCSI/ATA access, so the DaemonSet runs privileged as
    # root with /dev bind-mounted from the host — forbidden by Talos's default
    # baseline PodSecurity.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
