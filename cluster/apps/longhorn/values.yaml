longhorn:
  preUpgradeChecker:
    # ArgoCD skips Helm hooks, so the pre-upgrade job causes sync failures
    jobEnabled: false
  defaultSettings:
    defaultDataPath: /var/lib/longhorn
    # 2 replicas is sufficient for a 3-node cluster and reduces etcd write pressure
    # (only affects new volumes — scale existing with: kubectl patch volumes.longhorn.io <name> -n longhorn-system --type merge -p '{"spec":{"numberOfReplicas":2}}')
    defaultReplicaCount: 2
    # Cap snapshots per volume to limit CRD object growth in etcd
    snapshotMaxCount: 20
    # Limit concurrent replica rebuilds to reduce burst etcd writes during recovery
    concurrentReplicaRebuildPerNodeLimit: 2
    # Spread replicas across available nodes for better redundancy
    replicaAutoBalance: best-effort
    # Force-delete pods stuck on a down node so volumes can reattach elsewhere
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
    # Release the instance-manager PDB immediately when a node is cordoned so
    # Talos node drains (talosctl upgrade) complete unattended. Single-replica
    # volumes (CNPG, gitea-runner) keep their on-disk data across the kexec
    # reboot; we rely on CNPG streaming replicas + S3 backups, not Longhorn
    # eviction. Trade-off: no safety net if a node is permanently lost mid-drain.
    nodeDrainPolicy: always-allow
  defaultBackupStore:
    backupTarget: "s3://longhorn-backup@us-east-1/"
    backupTargetCredentialSecret: longhorn-s3-secret
  persistence:
    # Align the default `longhorn` StorageClass with defaultReplicaCount above.
    # The chart defaults this to 3, which silently overrides the cluster setting for new PVCs.
    defaultClassReplicaCount: 2
    recurringJobSelector:
      enable: true
      jobList: '[{"name":"longhorn-backup","isGroup":true}]'
