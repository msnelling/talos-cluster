actions:
  enabled: false
  giteaRootURL: "http://gitea-http.gitea.svc.cluster.local:3000"
  existingSecret: "runner-token"
  existingSecretKey: "token"

  global:
    # Node-local storage — the runner's data (registration + build cache) is
    # disposable and single-replica, so it never needed Longhorn's iSCSI hop.
    # See docs/plans/2026-07-10-cnpg-local-storage-design.md (follow-ups).
    storageClass: local-hostpath

  statefulset:
    replicas: 1
    runner:
      # registry+repository restate chart defaults so Renovate tracks the image.
      registry: docker.gitea.com
      repository: runner
      tag: "2.1.0"
      config: |
        log:
          level: info
        cache:
          enabled: false
        container:
          require_docker: true
          docker_timeout: 300s
    dind:
      # registry+repository restate chart defaults so Renovate tracks the image.
      # Pinned below 29.5.x: Docker 29.5.1's `docker cp` regression
      # (mkdirat var/run: file exists) breaks act_runner's toolcache copy into
      # the job container (see nektos/act#6092). 28-dind predates the regression.
      registry: docker.io
      repository: docker
      tag: "28-dind"
