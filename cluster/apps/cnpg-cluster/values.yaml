hostname: pg.xmple.io

instances: 3

storage:
  size: 10Gi
  # Node-local storage (OpenEBS localpv). CNPG's own streaming replication +
  # barman/S3 are the HA/DR layers; Longhorn added no redundancy here (1 replica)
  # and its iSCSI transport was the failure mode that wedged nodes under postgres
  # write load. See docs/plans/2026-07-10-cnpg-local-storage-design.md.
  storageClass: local-hostpath

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi

affinity:
  enablePodAntiAffinity: true
  # "required" hard-enforces one instance pod per node. With node-local storage
  # each instance's data is pinned to its node, so two instances drifting onto
  # one node is a SPOF; the default "preferred" lets that happen on
  # reboots/upgrades. The local-hostpath class's WaitForFirstConsumer binding
  # then provisions each PV on the anti-affinity-chosen node.
  podAntiAffinityType: required
  topologyKey: kubernetes.io/hostname

initdb:
  database: app
  owner: app

managedRoles:
  - name: gitea
    createdb: true
  - name: authelia
  - name: teslamate
  - name: hass
  - name: jellyseerr
  - name: grafana
    createdb: true

backup:
  endpointURL: "https://s3.xmple.io:9000"
  destinationPath: "s3://cnpg-backup/"
  secretName: cnpg-s3-creds
  retentionPolicy: "7d"
  wal:
    compression: gzip
    maxParallel: 1
  data:
    compression: gzip
    jobs: 2

scheduledBackup:
  schedule: "0 0 0 * * *"

postgresql:
  parameters:
    # Invalidate replication slots that retain more than this much WAL.
    # Prevents a stuck replica slot from filling the 10Gi volume, which
    # took the primary offline on 2026-04-24.
    max_slot_wal_keep_size: "4GB"
